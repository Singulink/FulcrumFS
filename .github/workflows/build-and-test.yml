name: build and test

on:
  push:
    branches: [ main, main14 ]
  pull_request:
    branches: [ main ]

# Auto-cancel any old in-progress runs for the same PR, but not for non-PR runs
concurrency:
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        configuration: [Debug, Release]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os == 'windows-latest' && 'test-core-windows-x64' || matrix.os == 'ubuntu-latest' && 'test-core-linux-x64' || 'test-core-macos-arm64' }}-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
    - name: Clean
      run: dotnet clean FulcrumFS.slnx --configuration ${{ matrix.configuration }} && dotnet nuget locals all --clear
    - name: Install dependencies
      run: dotnet restore FulcrumFS.slnx
    - name: Build
      run: dotnet build FulcrumFS.slnx --configuration ${{ matrix.configuration }} --no-restore
    - name: Test
      run: dotnet test FulcrumFS.NoVideos.slnf --configuration ${{ matrix.configuration }} --no-build --verbosity normal

  build-and-test-video:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        run-mode: [normal, hwaccel]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os == 'windows-latest' && 'test-video-windows-x64' || matrix.os == 'ubuntu-latest' && 'test-video-linux-x64' || 'test-video-macos-arm64' }}${{ matrix.run-mode == 'hwaccel' && '-explicit-hwaccel-modes' || '' }}

    steps:
    - name: Set hwaccel modes
      if: ${{ matrix.run-mode == 'hwaccel' }}
      shell: bash
      run: echo "HWACCEL_MODES=${{ matrix.os == 'windows-latest' && 'none qsv amf d3d12va d3d11va vulkan' || matrix.os == 'ubuntu-latest' && 'none qsv amf vulkan' || 'none videotoolbox vulkan' }}" >> "$GITHUB_ENV"
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
    - name: Build ffmpeg binaries (Unix)
      if: ${{ runner.os != 'Windows' && success() }}
      env:
        FFMPEG_OUTPUT_DIR: ${{ github.workspace }}/Binaries
      run: |
        mkdir -p "$FFMPEG_OUTPUT_DIR"
        bash .github/scripts/build-ffmpeg/unix/bootstrap-unix.sh
        chmod +x "$FFMPEG_OUTPUT_DIR"/*
    - name: Build ffmpeg binaries (Windows)
      if: ${{ runner.os == 'Windows' && success() }}
      env:
        FFMPEG_OUTPUT_DIR: ${{ github.workspace }}/Binaries
      run: |
        New-Item -ItemType Directory -Force -Path $env:FFMPEG_OUTPUT_DIR | Out-Null
        .\.github\scripts\build-ffmpeg\windows\bootstrap-windows.ps1
    - name: Copy test config
      shell: bash
      run: cp ".github/config/testconfig.${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'macos' }}.json" Tests/FulcrumFS.Videos.Tests/testconfig.json
    - name: Clean
      run: dotnet clean FulcrumFS.slnx && dotnet nuget locals all --clear
    - name: Install dependencies
      run: dotnet restore FulcrumFS.slnx
    - name: Build (Debug)
      if: ${{ matrix.run-mode == 'normal' && success() }}
      run: dotnet build FulcrumFS.slnx --configuration Debug --no-restore
    - name: Build (Release)
      if: ${{ matrix.run-mode == 'normal' && success() }}
      run: dotnet build FulcrumFS.slnx --configuration Release --no-restore
    - name: Test (Debug)
      if: ${{ matrix.run-mode == 'normal' && success() }}
      run: dotnet test Tests/FulcrumFS.Videos.Tests/FulcrumFS.Videos.Tests.csproj --configuration Debug --no-build --verbosity normal
      env:
        FFMPEG_BINARIES_PATH: ${{ github.workspace }}/Binaries
    - name: Test (Release)
      if: ${{ matrix.run-mode == 'normal' && !cancelled() }}
      run: dotnet test Tests/FulcrumFS.Videos.Tests/FulcrumFS.Videos.Tests.csproj --configuration Release --no-build --verbosity normal
      env:
        FFMPEG_BINARIES_PATH: ${{ github.workspace }}/Binaries
    - name: Build and test hwaccel modes (Release)
      if: ${{ matrix.run-mode == 'hwaccel' && success() }}
      shell: bash
      env:
        FFMPEG_BINARIES_PATH: ${{ github.workspace }}/Binaries
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          cpu_vendor=$(grep -m1 vendor_id /proc/cpuinfo | awk '{print $3}')
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          cpu_vendor=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Manufacturer" | tr -d '\r')
        else
          cpu_vendor=""
        fi
        for mode in $HWACCEL_MODES; do
          if [[ "$mode" == "qsv" && -n "$cpu_vendor" && "$cpu_vendor" != *Intel* ]]; then
            echo "Skipping HWACCEL_MODE=qsv (CPU vendor is '$cpu_vendor', not Intel)"
            continue
          fi
          if [[ "$mode" == "amf" && -n "$cpu_vendor" && "$cpu_vendor" != *AMD* && "$cpu_vendor" != *Advanced* ]]; then
            echo "Skipping HWACCEL_MODE=amf (CPU vendor is '$cpu_vendor', not AMD)"
            continue
          fi
          echo "::group::HWACCEL_MODE=$mode"
          export HWACCEL_MODE="$mode"
          dotnet build FulcrumFS.slnx --configuration Release --no-restore
          dotnet test Tests/FulcrumFS.Videos.Tests/FulcrumFS.Videos.Tests.csproj --configuration Release --no-build --verbosity normal
          cat Tests/FulcrumFS.Videos.Tests/HWAccelFailuresReport_Short.txt
          echo "::endgroup::"
          echo "::group::HWACCEL_MODE=$mode (Detailed Report of Hardware Acceleration Failures)"
          cat Tests/FulcrumFS.Videos.Tests/HWAccelFailuresReport_Detailed.txt
          echo "::endgroup::"
        done
